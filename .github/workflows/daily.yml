name: EyeHeist Daily

on:
  schedule:
    - cron: "13 1 * * *"    # 01:13 UTC (v noci) — 1 puzzle video/den
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install numpy pillow requests edge-tts

      - name: Prepare config
        run: cp config.example.json config.json

      - name: Render 1 puzzle video (EyeHeist)
        run: python puzzle_daily.py 1

      - name: Upload na YouTube (Shorts, naplanovane 8/15/20)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python push_to_youtube.py 1

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f config.json
          git add uploaded.json used_puzzles.json 2>/dev/null || true
          git commit -m "state: eyeheist run $(date -u +%F)" || echo "no changes"
          for _i in 1 2 3 4; do git pull --rebase -q origin main && git push -q && break || sleep 4; done
